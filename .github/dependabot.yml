version: 2
updates:
  - package-ecosystem: bun
    # The root manifest covers the Bun workspaces (packages/*) and bun.lock;
    # listing /packages/* too opens a duplicate PR per bump.
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@typescript/native-preview"
    groups:
      storybook:
        applies-to: version-updates
        patterns:
          - "storybook"
          - "@storybook/*"
          - "storybook-solidjs-vite"
          - "@chromatic-com/storybook"
        update-types: ["major", "minor", "patch"]

      ark-ui:
        applies-to: version-updates
        patterns:
          - "@ark-ui/*"
        update-types: ["minor", "patch"]

      tanstack-table:
        applies-to: version-updates
        patterns:
          - "@tanstack/*-table"
        update-types: ["major", "minor", "patch"]

      tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["major", "minor", "patch"]

      tsdown:
        applies-to: version-updates
        patterns:
          - "tsdown"
          - "@tsdown/*"
        update-types: ["major", "minor", "patch"]

      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-solid"
        update-types: ["minor", "patch"]

      testing:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@solidjs/testing-library"
          - "happy-dom"
          - "jsdom"
        update-types: ["minor", "patch"]

      react-runtime:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]

      icons:
        applies-to: version-updates
        patterns:
          - "lucide-react"
          - "lucide-solid"
        update-types: ["major", "minor", "patch"]

      typescript:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "@types/*"
        update-types: ["minor", "patch"]

      build-tooling:
        applies-to: version-updates
        patterns:
          - "turbo"
          - "rimraf"
          - "clean-package"
          - "lefthook"
        update-types: ["minor", "patch"]

      oxc-toolchain:
        applies-to: version-updates
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "oxfmt"
        update-types: ["major", "minor", "patch"]

      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
