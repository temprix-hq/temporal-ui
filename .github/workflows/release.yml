name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        uses: ./.github/actions/install

      - name: Apply accumulated changesets
        id: version
        env:
          # @changesets/changelog-github resolves PR links and authors via the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$pending" -eq 0 ]; then
            if node scripts/has-unpublished-versions.mjs; then
              echo "No changesets, but unpublished versions remain (retry)."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "No pending changesets and nothing to publish."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Applying $pending changeset(s)..."
          bun run ci:version
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes after changeset version."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: version packages"
          git push origin HEAD
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        uses: changesets/action@v2
        with:
          publish: bun run ci:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NPM_TOKEN: ""
