name: Release

# The run title is fixed when the run starts, so the version has to be an input
# (it cannot be read from the checkout). The first step checks it against
# packages/core/package.json, so a mistyped version never publishes.
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being released (must match packages/core/package.json on this ref, e.g. 1.1.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        uses: ./.github/actions/install

      - name: Check release state
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./packages/core/package.json').version")

          if [ "$INPUT_VERSION" != "$current" ]; then
            echo "::error::Requested version $INPUT_VERSION does not match $current in packages/core/package.json on this ref."
            exit 1
          fi

          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending pending changeset(s) on this ref. Run the Prepare release workflow and merge its version PR first."
            exit 1
          fi

          if node scripts/has-unpublished-versions.mjs; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Versions on this ref are already on npm. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        uses: changesets/action@v2
        with:
          publish-script: bun run ci:publish
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NPM_TOKEN: ""
