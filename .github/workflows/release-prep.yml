name: Prepare release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        uses: ./.github/actions/install

      - name: Open version PR
        env:
          # @changesets/changelog-github resolves PR links and authors via the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/main
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets. Nothing to prepare."
            exit 0
          fi

          # main only accepts changes through pull requests, so the version bump
          # goes to a release branch and is merged like any other change.
          echo "Applying $pending changeset(s) on $RELEASE_BRANCH..."
          git checkout -B "$RELEASE_BRANCH"
          bun run ci:version
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes after changeset version."
            exit 0
          fi

          version=$(node -p "require('./packages/core/package.json').version")
          git commit -m "chore: version packages (v$version)"
          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

          open_pr=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[].number')
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: version packages (v$version)" \
              --body "Applies the pending changesets: version bumps, changelogs and \`bun.lock\`. After this merges, run the **Release** workflow on \`main\` to publish v$version to npm. Re-running **Prepare release** before merging rebuilds this branch from \`main\`."
          else
            gh pr edit "$open_pr" --title "chore: version packages (v$version)"
          fi

          # Pushes made with GITHUB_TOKEN do not start pull_request workflows,
          # so start the required checks on the release branch explicitly.
          gh workflow run quality.yml --ref "$RELEASE_BRANCH"
          echo "Version PR is ready. Merge it, then run the Release workflow to publish."
