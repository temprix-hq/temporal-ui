name: Quality

on:
  pull_request:
  # Started by release-prep.yml on the version PR branch, where pull_request does not fire.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run checks
        uses: ./.github/actions/checks

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Run unit tests
        run: bun run test
